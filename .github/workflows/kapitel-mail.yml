name: Esats Tagebuch - Kapitelbenachrichtigungen

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/kapitel-mail.yml
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esats-kapitel-benachrichtigungen
  cancel-in-progress: false

jobs:
  kapitel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Kapitelstart setzen oder E-Mails senden
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        run: python .github/scripts/kapitel_mail.py
