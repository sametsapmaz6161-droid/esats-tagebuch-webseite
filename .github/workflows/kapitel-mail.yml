
name: Esats Tagebuch - Kapitelbenachrichtigungen

on:
  workflow_dispatch:
    inputs:
      reset_kapitel:
        description: "Alle 30 Kapitel neu starten"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: esats-kapitel-benachrichtigungen
  cancel-in-progress: false

jobs:
  kapitel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Kapitel-Timer starten oder E-Mails senden
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          RESET_KAPITEL: ${{ inputs.reset_kapitel }}
        run: python .github/scripts/kapitel_mail.py
