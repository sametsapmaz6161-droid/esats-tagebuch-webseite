
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esats Tagebuch ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #160d0a;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    .startseite {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #160d0a;
    }

    .bildbereich {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(100vw, 177.78dvh);
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      overflow: hidden;
    }

    .hintergrund, .video, .offenes-buch {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video, .offenes-buch {
      display: none;
    }

    .buch {
      position: absolute;
      left: 33%;
      top: 16%;
      width: 37%;
      height: 67%;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .buch:focus-visible {
      outline: 3px solid #ffc36a;
    }

    .hinweis {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      color: #ffe0ad;
      font-size: clamp(13px, 1.5vw, 20px);
      text-shadow: 0 2px 8px black;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      animation: pulsieren 2s infinite;
    }

    @keyframes pulsieren {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="startseite">
    <div class="bildbereich">
      <img
        id="startbild"
        src="startseite.png"
        alt="Esats geschlossenes Tagebuch"
        class="hintergrund"
      >

      <video id="buchvideo" class="video" preload="auto" playsinline>
        <source src="buch-oeffnen.mp4" type="video/mp4">
      </video>

      <img
        id="offenesbuch"
        src="buch-offen.png"
        alt="Esats geöffnetes Tagebuch mit Steckbrief"
        class="offenes-buch"
      >

      <button
        id="buchbutton"
        class="buch"
        aria-label="Tagebuch öffnen"
        onclick="buchOeffnen()"
      ></button>

      <div id="hinweis" class="hinweis">
        Klicke auf das Tagebuch 📖
      </div>
    </div>
  </main>

  <script>
    const video = document.getElementById("buchvideo");
    const startbild = document.getElementById("startbild");
    const offenesbuch = document.getElementById("offenesbuch");
    const button = document.getElementById("buchbutton");
    const hinweis = document.getElementById("hinweis");

    function buchOeffnen() {
      button.style.display = "none";
      hinweis.style.display = "none";

      video.style.display = "block";
      startbild.style.display = "none";

      video.currentTime = 0;

      video.play().catch(() => {
        video.controls = true;
      });
    }

    video.addEventListener("ended", () => {
      video.style.display = "none";
      offenesbuch.style.display = "block";
    });
  </script>
</body>
</html>
