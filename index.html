
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esats Tagebuch ❤️</title>

<style>
  :root {
    --papier: #fbf1db;
    --schrift: #714322;
    --leder: #392117;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: #160d0a;
    font-family: Georgia, "Times New Roman", serif;
  }

  /* STARTSEITE */

  .szene {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }

  .bildbereich {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(100vw, 177.78dvh);
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%);
  }

  .hintergrund,
  .video,
  .offenes-buch {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .video,
  .offenes-buch {
    display: none;
  }

  .buchbutton {
    position: absolute;
    left: 33%;
    top: 16%;
    width: 37%;
    height: 67%;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  .hinweis {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    color: #ffe0ad;
    text-shadow: 0 2px 8px #000;
    pointer-events: none;
    animation: pulsieren 2s infinite;
  }

  @keyframes pulsieren {
    50% { opacity: .45; }
  }

  .seitenklick {
    position: absolute;
    left: 52%;
    top: 22%;
    width: 28%;
    height: 55%;
    display: none;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  /* LESEMODUS */

  .lesemodus {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .6s ease;
  }

  .lesemodus.aktiv {
    display: flex;
    opacity: 1;
  }

  .blur-hintergrund {
    position: absolute;
    inset: -25px;
    background: url("buch-offen.png") center / cover no-repeat;
    filter: blur(15px) brightness(.5);
    transform: scale(1.05);
  }

  /* BUCH */

  .buch {
    position: relative;
    z-index: 2;
    width: min(92vw, 1600px);
    height: 90dvh;
    display: flex;
    perspective: 2400px;
    filter: drop-shadow(0 25px 35px #000a);
    transform: scale(.85);
    transition: transform .8s ease;
  }

  .lesemodus.aktiv .buch {
    transform: scale(1);
  }

  /* PAPIER */

  .papier {
    background-color: var(--papier);
    background-image:
      radial-gradient(
        ellipse at 35% 20%,
        rgba(255,255,255,.20),
        transparent 70%
      ),
      linear-gradient(
        90deg,
        rgba(100,70,40,.055),
        transparent 12%,
        transparent 90%,
        rgba(100,70,40,.035)
      );
  }

  /* BUCHSEITEN */

  .buchseite {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
    color: var(--schrift);
  }

  .links {
    border-radius: 14px 2px 2px 14px;
    box-shadow: inset -20px 0 25px -22px #43240e;
  }

  .rechts {
    border-radius: 2px 14px 14px 2px;
    box-shadow: inset 20px 0 25px -22px #43240e;
  }

  .steckbrief-seite {
    background: url("steckbrief.png") center / 100% 100% no-repeat;
  }

  /* SCHRIFT */

  .seiteninhalt {
    position: relative;
    height: 100%;
    overflow: hidden;
    padding: clamp(20px, 3vw, 48px);
    color: var(--schrift);
  }

  .seiteninhalt h2 {
    font-size: clamp(17px, 1.65vw, 24px);
    font-weight: normal;
    line-height: 1.45;
    margin: 0 0 24px;
  }

  .seiteninhalt p {
    font-size: clamp(12px, 1.12vw, 17px);
    line-height: 1.8;
    margin: 0 0 19px;
    overflow-wrap: break-word;
  }

  .seiteninhalt .datum {
    display: block;
    margin-bottom: 20px;
    font-size: clamp(11px, .9vw, 13px);
    letter-spacing: .04em;
    opacity: .7;
  }

  .seiteninhalt .seitenzahl {
    position: absolute;
    bottom: 17px;
    font-size: 12px;
    opacity: .5;
  }

  .rechts .seitenzahl,
  .blattseite:not(.rueck) .seitenzahl {
    right: 28px;
  }

  .links .seitenzahl,
  .blattseite.rueck .seitenzahl {
    left: 28px;
  }

  /* BUCHMITTE */

  .buchmitte {
    position: absolute;
    top: 0;
    left: calc(50% - 8px);
    height: 100%;
    width: 16px;
    background: linear-gradient(
      90deg,
      #67432477,
      #2b160c77,
      #67432455
    );
    z-index: 12;
    pointer-events: none;
  }

  /*
    ANIMIERTES BLATT
    Die Animation bleibt bewusst einfach,
    damit sie flüssig läuft.
  */

  .blatt {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform 1.15s cubic-bezier(.45,.05,.3,1);
    z-index: 10;
    display: none;
    pointer-events: none;
  }

  .blatt.umgeblattert {
    transform: rotateY(-180deg);
  }

  .blattseite {
    position: absolute;
    inset: 0;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 2px 12px 12px 2px;
    box-shadow: inset 14px 0 22px -20px #321b0d;
  }

  .blattseite.rueck {
    transform: rotateY(180deg);
    border-radius: 12px 2px 2px 12px;
  }

  /*
    ABDECKUNGEN FÜR DEN SEITENWECHSEL

    Sie sorgen dafür, dass Inhalte nicht
    vorzeitig sichtbar werden.
  */

  .seitenabdeckung {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 9;
    display: none;
    overflow: hidden;
    pointer-events: none;
  }

  .seitenabdeckung.links {
    left: 0;
  }

  .seitenabdeckung.rechts {
    right: 0;
  }

  /*
    Die Abdeckung auf der gegenüberliegenden
    Seite wird beim Blättern erst nach der
    halben Drehung ausgeblendet.
  */

  /* KLICKBEREICHE */

  .klickbereich {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 15;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .klickbereich.vor {
    right: 0;
  }

  .klickbereich.zurueck {
    left: 0;
  }

  /* STEUERUNG */

  .steuerung {
    position: absolute;
    bottom: 1%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    gap: 15px;
  }

  .steuerung button {
    background: var(--leder);
    color: #ffe0ad;
    border: 1px solid #c8a16d;
    border-radius: 8px;
    padding: 12px 20px;
    cursor: pointer;
  }

  .steuerung button:hover {
    background: #593628;
  }

  .steuerung button:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  /* MOBILE ANSICHT */

  @media (max-width: 650px) {
    .buch {
      width: 96vw;
      height: 75dvh;
    }

    .seiteninhalt {
      padding: 12px;
    }

    .seiteninhalt h2 {
      font-size: 15px;
      margin-bottom: 12px;
    }

    .seiteninhalt p {
      font-size: 10px;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .steuerung button {
      padding: 9px 12px;
      font-size: 12px;
    }
  }
</style>
</head>

<body>

<main class="szene">
  <div class="bildbereich">

    <img
      id="startbild"
      class="hintergrund"
      src="startseite.png"
      alt="Geschlossenes Tagebuch"
    >

    <video
      id="buchvideo"
      class="video"
      preload="auto"
      playsinline
    >
      <source src="buch-oeffnen.mp4" type="video/mp4">
    </video>

    <img
      id="offenesbuch"
      class="offenes-buch"
      src="buch-offen.png"
      alt="Geöffnetes Tagebuch"
    >

    <button
      id="buchbutton"
      class="buchbutton"
      onclick="buchOeffnen()"
      aria-label="Tagebuch öffnen"
    ></button>

    <div id="hinweis" class="hinweis">
      Klicke auf das Tagebuch 📖
    </div>

    <button
      id="seitenklick"
      class="seitenklick"
      onclick="lesemodusOeffnen()"
      aria-label="Lesemodus öffnen"
    ></button>

  </div>
</main>

<!-- LESEMODUS -->

<section
  id="lesemodus"
  class="lesemodus"
  aria-label="Tagebuch Lesemodus"
>

  <div class="blur-hintergrund"></div>

  <div class="buch">

    <!-- LINKE BUCHSEITE -->
    <div
      id="linkeSeite"
      class="buchseite links steckbrief-seite"
    ></div>

    <!-- RECHTE BUCHSEITE -->
    <div
      id="rechteSeite"
      class="buchseite rechts papier"
    ></div>

    <!-- ABDECKUNG LINKS -->
    <div
      id="abdeckungLinks"
      class="seitenabdeckung links"
    ></div>

    <!-- ABDECKUNG RECHTS -->
    <div
      id="abdeckungRechts"
      class="seitenabdeckung rechts"
    ></div>

    <!-- ANIMIERTES BLATT -->
    <div id="blatt" class="blatt">

      <div
        id="blattVorne"
        class="blattseite papier"
      ></div>

      <div
        id="blattHinten"
        class="blattseite rueck papier"
      ></div>

    </div>

    <div class="buchmitte"></div>

    <!-- KLICKBEREICHE -->
    <button
      class="klickbereich zurueck"
      onclick="zurueckblattern()"
      aria-label="Zurückblättern"
    ></button>

    <button
      class="klickbereich vor"
      onclick="vorblattern()"
      aria-label="Vorwärtsblättern"
    ></button>

  </div>

  <div class="steuerung">

    <button
      id="zurueckButton"
      onclick="zurueckblattern()"
    >
      ← Zurückblättern
    </button>

    <button onclick="lesemodusSchliessen()">
      ✕ Schließen
    </button>

  </div>

</section>

<script>
  const video = document.getElementById("buchvideo");
  const startbild = document.getElementById("startbild");
  const offenesbuch = document.getElementById("offenesbuch");
  const buchbutton = document.getElementById("buchbutton");
  const hinweis = document.getElementById("hinweis");
  const seitenklick = document.getElementById("seitenklick");
  const lesemodus = document.getElementById("lesemodus");

  const linkeSeite = document.getElementById("linkeSeite");
  const rechteSeite = document.getElementById("rechteSeite");

  const abdeckungLinks = document.getElementById("abdeckungLinks");
  const abdeckungRechts = document.getElementById("abdeckungRechts");

  const blatt = document.getElementById("blatt");
  const blattVorne = document.getElementById("blattVorne");
  const blattHinten = document.getElementById("blattHinten");

  const zurueckButton = document.getElementById("zurueckButton");

  let aktuelleDoppelseite = 0;
  let animationLaeuft = false;

  const BLATTER_DAUER = 1150;

  /* TESTEINTRÄGE */

  const eintraege = [
    {
      datum: "Tag 01",
      titel: "Sechs Jahre nach dem letzten Tagebucheintrag.",
      text: [
        "Liebes Tagebuch,",
        "sechs Jahre. Sechs verdammte Jahre. So lange habe ich nicht mehr in dich geschrieben. Als ich dich heute in einer alten Umzugskiste gefunden habe, musste ich lachen. Auf der ersten Seite steht noch mein Name. Esat. 27 Jahre alt. Single. Weißer Audi TT. Auf der Suche nach der großen Liebe.",
        "Was für ein Idiot. Damals dachte ich, das größte Problem meines Lebens wäre, ob Jessica mich wirklich liebt."
      ]
    },
    {
      datum: "Tag 02 – Testeintrag",
      titel: "Ein neuer Morgen",
      text: [
        "Liebes Tagebuch,",
        "heute beginnt ein neuer Abschnitt. Manchmal frage ich mich, wie viel sich in sechs Jahren verändern kann.",
        "Vielleicht ist es an der Zeit, meine Geschichte wieder aufzuschreiben."
      ]
    },
    {
      datum: "Tag 03 – Testeintrag",
      titel: "Alte Erinnerungen",
      text: [
        "Liebes Tagebuch,",
        "manche Erinnerungen verschwinden nie vollständig. Sie warten nur darauf, wiederentdeckt zu werden.",
        "Ich bin gespannt, was die nächsten Tage bringen."
      ]
    },
    {
      datum: "Tag 04 – Testeintrag",
      titel: "Was morgen bringt",
      text: [
        "Liebes Tagebuch,",
        "ich hätte nicht gedacht, dass ich wieder so regelmäßig schreiben würde.",
        "Aber vielleicht hilft es mir, die Dinge klarer zu sehen."
      ]
    }
  ];

  /* EINTRAG ALS HTML */

  function eintragHTML(eintrag, seitenzahl) {
    if (!eintrag) return "";

    const abschnitte = eintrag.text
      .map(absatz => `<p>${absatz}</p>`)
      .join("");

    return `
      <div class="seiteninhalt">
        <span class="datum">${eintrag.datum}</span>
        <h2>${eintrag.titel}</h2>
        ${abschnitte}
        <span class="seitenzahl">${seitenzahl}</span>
      </div>
    `;
  }

  function anzahlDoppelseiten() {
    return Math.ceil((eintraege.length + 1) / 2);
  }

  function linkeHTML(index) {
    if (index === 0) return null;

    const eintragIndex = index * 2 - 1;

    return eintragHTML(
      eintraege[eintragIndex],
      eintragIndex + 2
    );
  }

  function rechteHTML(index) {
    const eintragIndex = index * 2;

    return eintragHTML(
      eintraege[eintragIndex],
      eintragIndex + 2
    );
  }

  /* SEITEN ANZEIGEN */

  function seitenAnzeigen() {
    if (aktuelleDoppelseite === 0) {
      linkeSeite.className =
        "buchseite links steckbrief-seite";
      linkeSeite.innerHTML = "";
    } else {
      linkeSeite.className =
        "buchseite links papier";
      linkeSeite.innerHTML =
        linkeHTML(aktuelleDoppelseite);
    }

    rechteSeite.className =
      "buchseite rechts papier";

    rechteSeite.innerHTML =
      rechteHTML(aktuelleDoppelseite);

    zurueckButton.disabled =
      aktuelleDoppelseite === 0;
  }

  /* BUCH ÖFFNEN */

  function buchOeffnen() {
    buchbutton.style.display = "none";
    hinweis.style.display = "none";
    startbild.style.display = "none";

    video.style.display = "block";
    video.currentTime = 0;

    video.play().catch(() => {
      video.controls = true;
    });
  }

  video.addEventListener("ended", () => {
    video.style.display = "none";
    offenesbuch.style.display = "block";
    seitenklick.style.display = "block";
  });

  /* LESEMODUS */

  function lesemodusOeffnen() {
    aktuelleDoppelseite = 0;
    seitenAnzeigen();

    lesemodus.style.display = "flex";

    requestAnimationFrame(() => {
      lesemodus.classList.add("aktiv");
    });
  }

  function lesemodusSchliessen() {
    if (animationLaeuft) return;

    lesemodus.classList.remove("aktiv");

    setTimeout(() => {
      lesemodus.style.display = "none";
    }, 600);
  }

  /*
    VORWÄRTSBLÄTTERN

    Die neue rechte Seite wird erst
    sichtbar, nachdem das Blatt die
    bisherige rechte Seite verlassen hat.
  */

  function vorblattern() {
    if (animationLaeuft) return;

    if (
      aktuelleDoppelseite >=
      anzahlDoppelseiten() - 1
    ) return;

    animationLaeuft = true;

    const naechsteSeite =
      aktuelleDoppelseite + 1;

    /* Alte linke Seite vorerst festhalten */
    abdeckungLinks.className =
      "seitenabdeckung links " +
      (aktuelleDoppelseite === 0
        ? "steckbrief-seite"
        : "papier");

    abdeckungLinks.innerHTML =
      aktuelleDoppelseite === 0
        ? ""
        : linkeHTML(aktuelleDoppelseite);

    abdeckungLinks.style.display = "block";

    /* Blatt mit alter rechter Seite */
    blattVorne.innerHTML =
      rechteHTML(aktuelleDoppelseite);

    /* Rückseite des Blatts */
    blattHinten.innerHTML =
      linkeHTML(naechsteSeite);

    /*
      Neue Doppelseite liegt darunter.
      Rechts wird sie durch das Blatt
      zunächst vollständig verdeckt.
    */

    aktuelleDoppelseite = naechsteSeite;
    seitenAnzeigen();

    blatt.style.transition = "none";
    blatt.style.display = "block";
    blatt.classList.remove("umgeblattert");

    void blatt.offsetWidth;

    blatt.style.transition =
      "transform 1.15s cubic-bezier(.45,.05,.3,1)";

    requestAnimationFrame(() => {
      blatt.classList.add("umgeblattert");
    });

    setTimeout(() => {
      abdeckungLinks.style.display = "none";
    }, BLATTER_DAUER / 2);

    setTimeout(() => {
      blatt.style.display = "none";
      blatt.classList.remove("umgeblattert");
      animationLaeuft = false;
    }, BLATTER_DAUER + 50);
  }

  /*
    RÜCKWÄRTSBLÄTTERN

    Die bisherige rechte Seite bleibt
    sichtbar, bis das Blatt sie wieder
    verdeckt.
  */

  function zurueckblattern() {
    if (animationLaeuft) return;
    if (aktuelleDoppelseite === 0) return;

    animationLaeuft = true;

    const vorherigeSeite =
      aktuelleDoppelseite - 1;

    /* Alte rechte Seite festhalten */
    abdeckungRechts.className =
      "seitenabdeckung rechts papier";

    abdeckungRechts.innerHTML =
      rechteHTML(aktuelleDoppelseite);

    abdeckungRechts.style.display = "block";

    /* Blattseiten vorbereiten */
    blattVorne.innerHTML =
      rechteHTML(vorherigeSeite);

    blattHinten.innerHTML =
      linkeHTML(aktuelleDoppelseite);

    blatt.style.transition = "none";
    blatt.style.display = "block";
    blatt.classList.add("umgeblattert");

    aktuelleDoppelseite = vorherigeSeite;
    seitenAnzeigen();

    void blatt.offsetWidth;

    blatt.style.transition =
      "transform 1.15s cubic-bezier(.45,.05,.3,1)";

    requestAnimationFrame(() => {
      blatt.classList.remove("umgeblattert");
    });

    setTimeout(() => {
      abdeckungRechts.style.display = "none";
    }, BLATTER_DAUER / 2);

    setTimeout(() => {
      blatt.style.display = "none";
      animationLaeuft = false;
    }, BLATTER_DAUER + 50);
  }

  /* ERSTE SEITE */

  seitenAnzeigen();
</script>

</body>
</html>
