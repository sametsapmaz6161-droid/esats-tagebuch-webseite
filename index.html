
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esats Tagebuch ❤️</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #160d0a;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    .startseite {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    .bildbereich {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(100vw, 177.78dvh);
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      overflow: hidden;
      perspective: 1800px;
    }

    .hintergrund, .video, .offenes-buch {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video, .offenes-buch {
      display: none;
    }

    .buchbutton {
      position: absolute;
      left: 33%;
      top: 16%;
      width: 37%;
      height: 67%;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .hinweis {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      color: #ffe0ad;
      font-size: clamp(13px, 1.5vw, 20px);
      text-shadow: 0 2px 8px black;
      white-space: nowrap;
      pointer-events: none;
      animation: pulsieren 2s infinite;
    }

    @keyframes pulsieren {
      0%, 100% { opacity: .5; }
      50% { opacity: 1; }
    }

    /* Umblätterbare Seite auf der rechten Buchhälfte */
    .seitenbereich {
      position: absolute;
      left: 51%;
      top: 23%;
      width: 29%;
      height: 56%;
      display: none;
      perspective: 1400px;
      z-index: 5;
    }

    .testseite {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.3s ease-in-out;
      cursor: pointer;
    }

    .testseite.umgeblattert {
      transform: rotateY(-175deg);
    }

    .vorderseite, .rueckseite {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 2px 12px 12px 2px;
      background: #ead7ac;
      box-shadow: 2px 2px 10px #0005;
      padding: 12%;
      color: #563b2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .rueckseite {
      transform: rotateY(180deg);
      background: #e3cca0;
    }

    .seitenbereich button {
      font-family: Georgia, serif;
    }

    .zurueck {
      position: absolute;
      right: 3%;
      bottom: 5%;
      display: none;
      z-index: 10;
      padding: 10px 18px;
      border: 1px solid #d5ad75;
      border-radius: 8px;
      background: #3c231a;
      color: #ffe0ad;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      .vorderseite, .rueckseite {
        font-size: 9px;
        padding: 6%;
      }
      .zurueck {
        padding: 6px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <main class="startseite">
    <div class="bildbereich">

      <img id="startbild" class="hintergrund"
           src="startseite.png" alt="Geschlossenes Tagebuch">

      <video id="buchvideo" class="video"
             preload="auto" playsinline>
        <source src="buch-oeffnen.mp4" type="video/mp4">
      </video>

      <img id="offenesbuch" class="offenes-buch"
           src="buch-offen.png" alt="Geöffnetes Tagebuch">

      <button id="buchbutton" class="buchbutton"
              aria-label="Tagebuch öffnen"
              onclick="buchOeffnen()"></button>

      <div id="hinweis" class="hinweis">
        Klicke auf das Tagebuch 📖
      </div>

      <div id="seitenbereich" class="seitenbereich">
        <div id="testseite" class="testseite"
             onclick="seiteUmblattern()">

          <div class="vorderseite">
            <h2>Tag 01</h2>
            <p>Hier beginnt Esats Geschichte ...</p>
            <small>Zum Umblättern klicken →</small>
          </div>

          <div class="rueckseite">
            <h2>Esats Tagebuch ❤️</h2>
            <p>Die erste Seite wurde umgeblättert!</p>
          </div>

        </div>
      </div>

      <button id="zurueck" class="zurueck"
              onclick="zurueckBlattern()">
        ↶ Zurückblättern
      </button>

    </div>
  </main>

  <script>
    const video = document.getElementById("buchvideo");
    const startbild = document.getElementById("startbild");
    const offenesbuch = document.getElementById("offenesbuch");
    const button = document.getElementById("buchbutton");
    const hinweis = document.getElementById("hinweis");
    const seitenbereich = document.getElementById("seitenbereich");
    const testseite = document.getElementById("testseite");
    const zurueck = document.getElementById("zurueck");

    function buchOeffnen() {
      button.style.display = "none";
      hinweis.style.display = "none";
      video.style.display = "block";
      startbild.style.display = "none";

      video.currentTime = 0;
      video.play().catch(() => {
        video.controls = true;
      });
    }

    video.addEventListener("ended", () => {
      video.style.display = "none";
      offenesbuch.style.display = "block";
      seitenbereich.style.display = "block";
    });

    function seiteUmblattern() {
      testseite.classList.toggle("umgeblattert");
      zurueck.style.display =
        testseite.classList.contains("umgeblattert")
        ? "block" : "none";
    }

    function zurueckBlattern() {
      testseite.classList.remove("umgeblattert");
      zurueck.style.display = "none";
    }
  </script>

</body>
</html>
