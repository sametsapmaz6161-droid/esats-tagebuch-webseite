
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esats Tagebuch ❤️</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: #160d0a;
    font-family: Georgia, serif;
  }

  /* STARTSEITE */

  .szene {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }

  .bildbereich {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(100vw, 177.78dvh);
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%);
  }

  .hintergrund,
  .video,
  .offenes-buch {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .video,
  .offenes-buch {
    display: none;
  }

  .buchbutton {
    position: absolute;
    left: 33%;
    top: 16%;
    width: 37%;
    height: 67%;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  .hinweis {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    color: #ffe0ad;
    text-shadow: 0 2px 8px #000;
    pointer-events: none;
    animation: pulsieren 2s infinite;
  }

  @keyframes pulsieren {
    50% {
      opacity: .45;
    }
  }

  .seitenklick {
    position: absolute;
    left: 52%;
    top: 22%;
    width: 28%;
    height: 55%;
    display: none;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  /* LESEMODUS */

  .lesemodus {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .6s ease;
  }

  .lesemodus.aktiv {
    display: flex;
    opacity: 1;
  }

  /* VERSCHWOMMENER SCHREIBTISCH */

  .blur-hintergrund {
    position: absolute;
    inset: -25px;
    background: url("buch-offen.png") center / cover no-repeat;
    filter: blur(15px) brightness(.5);
    transform: scale(1.05);
  }

  /* BUCHGRÖSSE: 90 % HÖHE */

  .buch {
    position: relative;
    z-index: 2;
    width: min(92vw, 1600px);
    height: 90dvh;
    display: flex;
    filter: drop-shadow(0 25px 35px #000a);
    transform: scale(.85);
    transition: transform .8s ease;
    perspective: 2200px;
  }

  .lesemodus.aktiv .buch {
    transform: scale(1);
  }

  /* GEMEINSAME BUCHSEITEN */

  .buchseite {
    position: relative;
    width: 50%;
    height: 100%;
    color: #49392f;
    padding: clamp(20px, 3vw, 52px);
    overflow: hidden;
  }

  /* LINKE SEITE: STECKBRIEF BLEIBT UNVERÄNDERT */

  .links {
    border-radius: 14px 2px 2px 14px;
    box-shadow: inset -22px 0 28px -25px #43240e;
  }

  .steckbrief-seite {
    background-image: url("steckbrief.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    padding: 0;
  }

  /* NEUES CREMEWEISSES PAPIER */

  .papier {
    background-color: #f7f0df;
    background-image:
      radial-gradient(
        ellipse at 45% 25%,
        rgba(255, 255, 255, 0.34),
        transparent 65%
      ),
      repeating-linear-gradient(
        0deg,
        rgba(113, 87, 59, 0.012) 0px,
        rgba(113, 87, 59, 0.012) 1px,
        transparent 1px,
        transparent 5px
      ),
      linear-gradient(
        90deg,
        rgba(99, 69, 41, 0.075),
        transparent 12%,
        transparent 88%,
        rgba(99, 69, 41, 0.045)
      );
  }

  /* RECHTE BUCHSEITE */

  .rechts {
    border-radius: 2px 14px 14px 2px;
    box-shadow:
      inset 22px 0 28px -25px #43240e,
      inset -8px 0 18px -16px #43240e;
  }

  .buchseite h1 {
    text-align: center;
    font-size: clamp(22px, 2.7vw, 40px);
    margin-bottom: 35px;
    color: #463429;
  }

  .buchseite p {
    font-size: clamp(14px, 1.4vw, 20px);
    line-height: 1.8;
  }

  /* BUCHMITTE */

  .buchmitte {
    position: absolute;
    top: 0;
    left: calc(50% - 8px);
    height: 100%;
    width: 16px;
    background: linear-gradient(
      90deg,
      #67432477,
      #2b160c77,
      #67432455
    );
    z-index: 5;
    pointer-events: none;
  }

  /* UMBLÄTTERBARES BLATT */

  .blatt {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.2s ease-in-out;
    z-index: 6;
    cursor: pointer;
  }

  .blatt.umgeblattert {
    transform: rotateY(-180deg);
  }

  .blattseite {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 2px 12px 12px 2px;
    padding: clamp(20px, 3vw, 52px);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: #49392f;
    text-align: center;

    box-shadow:
      inset 14px 0 25px -22px #321b0d,
      inset -7px 0 15px -14px #321b0d;
  }

  .blattseite.rueck {
    transform: rotateY(180deg);
    border-radius: 12px 2px 2px 12px;
  }

  .blattseite h2 {
    font-size: clamp(24px, 3vw, 44px);
    font-weight: normal;
    color: #463429;
    margin-bottom: 12px;
  }

  .blattseite p {
    font-size: clamp(14px, 1.4vw, 20px);
    line-height: 1.8;
  }

  .blattseite small {
    margin-top: 28px;
    opacity: .65;
    font-style: italic;
  }

  /* STEUERUNG */

  .steuerung {
    position: absolute;
    bottom: 1%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    gap: 15px;
  }

  .steuerung button {
    background: #392117;
    color: #ffe0ad;
    border: 1px solid #c8a16d;
    border-radius: 8px;
    padding: 12px 20px;
    cursor: pointer;
  }

  .steuerung button:hover {
    background: #593628;
  }

  /* MOBILE ANSICHT */

  @media (max-width: 650px) {
    .buch {
      width: 96vw;
      height: 75dvh;
    }

    .buchseite,
    .blattseite {
      padding: 12px;
    }

    .steckbrief-seite {
      padding: 0;
    }

    .steuerung button {
      padding: 9px 12px;
    }
  }
</style>
</head>

<body>

<main class="szene">
  <div class="bildbereich">

    <!-- GESCHLOSSENES TAGEBUCH -->
    <img
      id="startbild"
      class="hintergrund"
      src="startseite.png"
      alt="Geschlossenes Tagebuch"
    >

    <!-- BUCHÖFFNUNGSANIMATION -->
    <video
      id="buchvideo"
      class="video"
      preload="auto"
      playsinline
    >
      <source src="buch-oeffnen.mp4" type="video/mp4">
    </video>

    <!-- GEÖFFNETES TAGEBUCH -->
    <img
      id="offenesbuch"
      class="offenes-buch"
      src="buch-offen.png"
      alt="Geöffnetes Tagebuch"
    >

    <!-- BUCH ÖFFNEN -->
    <button
      id="buchbutton"
      class="buchbutton"
      onclick="buchOeffnen()"
      aria-label="Tagebuch öffnen"
    ></button>

    <div id="hinweis" class="hinweis">
      Klicke auf das Tagebuch 📖
    </div>

    <!-- LESEMODUS STARTEN -->
    <button
      id="seitenklick"
      class="seitenklick"
      onclick="lesemodusOeffnen()"
      aria-label="Lesemodus öffnen"
    ></button>

  </div>
</main>

<!-- LESEMODUS -->

<section
  id="lesemodus"
  class="lesemodus"
  aria-label="Tagebuch Lesemodus"
>

  <!-- VERSCHWOMMENER HINTERGRUND -->
  <div class="blur-hintergrund"></div>

  <!-- GROSSES TAGEBUCH -->
  <div class="buch">

    <!-- LINKE SEITE: STECKBRIEF -->
    <div class="buchseite links steckbrief-seite"></div>

    <!-- RECHTE SEITE: CREMEWEISSES PAPIER -->
    <div class="buchseite rechts papier">
      <h1>Tag 01</h1>
      <p>Hier beginnt Esats Geschichte ...</p>
    </div>

    <!-- BUCHMITTE -->
    <div class="buchmitte"></div>

    <!-- UMBLÄTTERBARES BLATT -->
    <div
      id="blatt"
      class="blatt"
      onclick="umblattern()"
    >

      <!-- VORDERSEITE -->
      <div class="blattseite papier">
        <h2>Tag 01</h2>
        <p>Der Anfang einer besonderen Geschichte ...</p>
        <small>Zum Umblättern klicken →</small>
      </div>

      <!-- RÜCKSEITE -->
      <div class="blattseite rueck papier">
        <h2>Seite 2</h2>
        <p>Hier geht Esats Geschichte weiter ...</p>
      </div>

    </div>

  </div>

  <!-- STEUERUNG -->
  <div class="steuerung">

    <button onclick="zurueck()">
      ← Zurückblättern
    </button>

    <button onclick="lesemodusSchliessen()">
      ✕ Schließen
    </button>

  </div>

</section>

<script>
  const video = document.getElementById("buchvideo");
  const startbild = document.getElementById("startbild");
  const offenesbuch = document.getElementById("offenesbuch");
  const buchbutton = document.getElementById("buchbutton");
  const hinweis = document.getElementById("hinweis");
  const seitenklick = document.getElementById("seitenklick");
  const lesemodus = document.getElementById("lesemodus");
  const blatt = document.getElementById("blatt");

  /* BUCH ÖFFNEN */

  function buchOeffnen() {
    buchbutton.style.display = "none";
    hinweis.style.display = "none";

    startbild.style.display = "none";
    video.style.display = "block";

    video.currentTime = 0;

    video.play().catch(() => {
      video.controls = true;
    });
  }

  /* NACH VIDEO DAS GEÖFFNETE BUCH ANZEIGEN */

  video.addEventListener("ended", () => {
    video.style.display = "none";
    offenesbuch.style.display = "block";
    seitenklick.style.display = "block";
  });

  /* LESEMODUS ÖFFNEN */

  function lesemodusOeffnen() {
    lesemodus.style.display = "flex";

    requestAnimationFrame(() => {
      lesemodus.classList.add("aktiv");
    });
  }

  /* LESEMODUS SCHLIESSEN */

  function lesemodusSchliessen() {
    lesemodus.classList.remove("aktiv");

    setTimeout(() => {
      lesemodus.style.display = "none";
    }, 600);
  }

  /* SEITE UMBLÄTTERN */

  function umblattern() {
    blatt.classList.toggle("umgeblattert");
  }

  /* ZURÜCKBLÄTTERN */

  function zurueck() {
    blatt.classList.remove("umgeblattert");
  }
</script>

</body>
</html>
