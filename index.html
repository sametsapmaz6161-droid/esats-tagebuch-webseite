
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esats Tagebuch ❤️</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: #160d0a;
    font-family: Georgia, "Times New Roman", serif;
  }

  /* STARTSEITE */

  .szene {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }

  .bildbereich {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(100vw, 177.78dvh);
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%);
  }

  .hintergrund,
  .video,
  .offenes-buch {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .video,
  .offenes-buch {
    display: none;
  }

  .buchbutton {
    position: absolute;
    left: 33%;
    top: 16%;
    width: 37%;
    height: 67%;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  .hinweis {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    color: #ffe0ad;
    text-shadow: 0 2px 8px #000;
    pointer-events: none;
    animation: pulsieren 2s infinite;
  }

  @keyframes pulsieren {
    50% { opacity: .45; }
  }

  .seitenklick {
    position: absolute;
    left: 52%;
    top: 22%;
    width: 28%;
    height: 55%;
    display: none;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  /* LESEMODUS */

  .lesemodus {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .6s ease;
  }

  .lesemodus.aktiv {
    display: flex;
    opacity: 1;
  }

  .blur-hintergrund {
    position: absolute;
    inset: -25px;
    background: url("buch-offen.png") center / cover no-repeat;
    filter: blur(15px) brightness(.5);
    transform: scale(1.05);
  }

  /* BUCH */

  .buch {
    position: relative;
    z-index: 2;
    width: min(92vw, 1600px);
    height: 90dvh;
    display: flex;
    perspective: 2400px;
    filter: drop-shadow(0 25px 35px #000a);
    transform: scale(.85);
    transition: transform .8s ease;
  }

  .lesemodus.aktiv .buch {
    transform: scale(1);
  }

  /* PAPIERFARBEN AUS DEM SCREENSHOT */

  :root {
    --papier: #fbf1db;
    --schrift: #714322;
    --rand: #bda17a;
  }

  .papier {
    background-color: var(--papier);
    background-image:
      radial-gradient(
        ellipse at 35% 20%,
        rgba(255,255,255,.20),
        transparent 70%
      ),
      linear-gradient(
        90deg,
        rgba(100,70,40,.055),
        transparent 12%,
        transparent 90%,
        rgba(100,70,40,.035)
      );
  }

  /* SICHTBARE BUCHSEITEN */

  .buchseite {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
    color: var(--schrift);
  }

  .links {
    border-radius: 14px 2px 2px 14px;
    box-shadow: inset -20px 0 25px -22px #43240e;
  }

  .rechts {
    border-radius: 2px 14px 14px 2px;
    box-shadow: inset 20px 0 25px -22px #43240e;
  }

  .steckbrief-seite {
    background: url("steckbrief.png") center / 100% 100% no-repeat;
  }

  /* INHALT DER TAGEBUCHSEITEN */

  .seiteninhalt {
    height: 100%;
    overflow: hidden;
    padding: clamp(22px, 3.1vw, 52px);
    color: var(--schrift);
  }

  .seiteninhalt h2 {
    font-size: clamp(19px, 2vw, 29px);
    font-weight: normal;
    line-height: 1.4;
    margin: 0 0 30px;
  }

  .seiteninhalt p {
    font-size: clamp(15px, 1.42vw, 21px);
    line-height: 1.85;
    margin: 0 0 24px;
    overflow-wrap: break-word;
  }

  .seiteninhalt .datum {
    display: block;
    margin-bottom: 24px;
    font-size: clamp(12px, 1vw, 15px);
    letter-spacing: .04em;
    opacity: .7;
  }

  .seiteninhalt .seitenzahl {
    position: absolute;
    bottom: 18px;
    font-size: 13px;
    opacity: .55;
  }

  .rechts .seitenzahl {
    right: 30px;
  }

  .links .seitenzahl {
    left: 30px;
  }

  /* BUCHMITTE */

  .buchmitte {
    position: absolute;
    top: 0;
    left: calc(50% - 8px);
    width: 16px;
    height: 100%;
    background: linear-gradient(
      90deg,
      #67432477,
      #2b160c77,
      #67432455
    );
    z-index: 12;
    pointer-events: none;
  }

  /* ANIMIERTES BLATT */

  .blatt {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.15s cubic-bezier(.45,.05,.3,1);
    z-index: 10;
    display: none;
    pointer-events: none;
  }

  .blatt.umgeblattert {
    transform: rotateY(-180deg);
  }

  .blattseite {
    position: absolute;
    inset: 0;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 2px 12px 12px 2px;
    box-shadow: inset 16px 0 25px -22px #321b0d;
  }

  .blattseite.rueck {
    transform: rotateY(180deg);
    border-radius: 12px 2px 2px 12px;
    box-shadow: inset -16px 0 25px -22px #321b0d;
  }

  /* KLICKBEREICHE */

  .klickbereich {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    z-index: 15;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .klickbereich.vor {
    right: 0;
  }

  .klickbereich.zurueck {
    left: 0;
  }

  /* STEUERUNG */

  .steuerung {
    position: absolute;
    bottom: 1%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    gap: 15px;
  }

  .steuerung button {
    background: #392117;
    color: #ffe0ad;
    border: 1px solid #c8a16d;
    border-radius: 8px;
    padding: 12px 20px;
    cursor: pointer;
  }

  .steuerung button:hover {
    background: #593628;
  }

  .steuerung button:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  /* MOBILE ANSICHT */

  @media (max-width: 650px) {
    .buch {
      width: 96vw;
      height: 75dvh;
    }

    .seiteninhalt {
      padding: 13px;
    }

    .seiteninhalt h2 {
      font-size: 16px;
      margin-bottom: 14px;
    }

    .seiteninhalt p {
      font-size: 11px;
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .steuerung button {
      padding: 9px 12px;
      font-size: 12px;
    }
  }
</style>
</head>

<body>

<main class="szene">
  <div class="bildbereich">

    <img
      id="startbild"
      class="hintergrund"
      src="startseite.png"
      alt="Geschlossenes Tagebuch"
    >

    <video
      id="buchvideo"
      class="video"
      preload="auto"
      playsinline
    >
      <source src="buch-oeffnen.mp4" type="video/mp4">
    </video>

    <img
      id="offenesbuch"
      class="offenes-buch"
      src="buch-offen.png"
      alt="Geöffnetes Tagebuch"
    >

    <button
      id="buchbutton"
      class="buchbutton"
      onclick="buchOeffnen()"
      aria-label="Tagebuch öffnen"
    ></button>

    <div id="hinweis" class="hinweis">
      Klicke auf das Tagebuch 📖
    </div>

    <button
      id="seitenklick"
      class="seitenklick"
      onclick="lesemodusOeffnen()"
      aria-label="Lesemodus öffnen"
    ></button>

  </div>
</main>

<!-- LESEMODUS -->

<section
  id="lesemodus"
  class="lesemodus"
  aria-label="Tagebuch Lesemodus"
>

  <div class="blur-hintergrund"></div>

  <div class="buch">

    <!-- LINKE SEITE -->
    <div
      id="linkeSeite"
      class="buchseite links steckbrief-seite"
    ></div>

    <!-- RECHTE SEITE -->
    <div
      id="rechteSeite"
      class="buchseite rechts papier"
    ></div>

    <!-- ANIMIERTES BLATT -->
    <div id="blatt" class="blatt">

      <div
        id="blattVorne"
        class="blattseite papier"
      ></div>

      <div
        id="blattHinten"
        class="blattseite rueck papier"
      ></div>

    </div>

    <div class="buchmitte"></div>

    <!-- KLICK ZURÜCK -->
    <button
      class="klickbereich zurueck"
      onclick="zurueckblattern()"
      aria-label="Zurückblättern"
    ></button>

    <!-- KLICK VORWÄRTS -->
    <button
      class="klickbereich vor"
      onclick="vorblattern()"
      aria-label="Vorwärtsblättern"
    ></button>

  </div>

  <div class="steuerung">

    <button
      id="zurueckButton"
      onclick="zurueckblattern()"
    >
      ← Zurückblättern
    </button>

    <button onclick="lesemodusSchliessen()">
      ✕ Schließen
    </button>

  </div>

</section>

<script>
  const video = document.getElementById("buchvideo");
  const startbild = document.getElementById("startbild");
  const offenesbuch = document.getElementById("offenesbuch");
  const buchbutton = document.getElementById("buchbutton");
  const hinweis = document.getElementById("hinweis");
  const seitenklick = document.getElementById("seitenklick");
  const lesemodus = document.getElementById("lesemodus");

  const linkeSeite = document.getElementById("linkeSeite");
  const rechteSeite = document.getElementById("rechteSeite");
  const blatt = document.getElementById("blatt");
  const blattVorne = document.getElementById("blattVorne");
  const blattHinten = document.getElementById("blattHinten");
  const zurueckButton = document.getElementById("zurueckButton");

  let aktuelleDoppelseite = 0;
  let animationLaeuft = false;

  /*
    TESTEINTRÄGE

    Jeder Eintrag besitzt eine Überschrift,
    ein Datum und den eigentlichen Tagebuchtext.

    Die echten 30 Einträge fügen wir später ein.
  */

  const eintraege = [
    {
      datum: "Tag 01",
      titel: "Sechs Jahre nach dem letzten Tagebucheintrag.",
      text: [
        "Liebes Tagebuch,",
        "sechs Jahre. Sechs verdammte Jahre. So lange habe ich nicht mehr in dich geschrieben. Als ich dich heute in einer alten Umzugskiste gefunden habe, musste ich lachen. Auf der ersten Seite steht noch mein Name. Esat. 27 Jahre alt. Single. Weißer Audi TT. Auf der Suche nach der großen Liebe.",
        "Was für ein Idiot. Damals dachte ich, das größte Problem meines Lebens wäre, ob Jessica mich wirklich liebt."
      ]
    },
    {
      datum: "Tag 02 – Testeintrag",
      titel: "Ein neuer Morgen",
      text: [
        "Liebes Tagebuch,",
        "heute beginnt ein neuer Abschnitt. Manchmal frage ich mich, wie viel sich in sechs Jahren verändern kann.",
        "Vielleicht ist es an der Zeit, meine Geschichte wieder aufzuschreiben."
      ]
    },
    {
      datum: "Tag 03 – Testeintrag",
      titel: "Alte Erinnerungen",
      text: [
        "Liebes Tagebuch,",
        "manche Erinnerungen verschwinden nie vollständig. Sie warten nur darauf, wiederentdeckt zu werden.",
        "Ich bin gespannt, was die nächsten Tage bringen."
      ]
    },
    {
      datum: "Tag 04 – Testeintrag",
      titel: "Was morgen bringt",
      text: [
        "Liebes Tagebuch,",
        "ich hätte nicht gedacht, dass ich wieder so regelmäßig schreiben würde.",
        "Aber vielleicht hilft es mir, die Dinge klarer zu sehen."
      ]
    }
  ];

  /*
    AUS EINTRÄGEN HTML ERZEUGEN
  */

  function eintragHTML(eintrag, seitenzahl) {
    if (!eintrag) {
      return "";
    }

    const abschnitte = eintrag.text
      .map(absatz => `<p>${absatz}</p>`)
      .join("");

    return `
      <div class="seiteninhalt">
        <span class="datum">${eintrag.datum}</span>
        <h2>${eintrag.titel}</h2>
        ${abschnitte}
        <span class="seitenzahl">${seitenzahl}</span>
      </div>
    `;
  }

  /*
    DOPPELSEITEN:
    0 = Steckbrief links, Tag 01 rechts
    1 = Tag 02 links, Tag 03 rechts
    2 = Tag 04 links, rechte Seite leer
  */

  function anzahlDoppelseiten() {
    return Math.ceil((eintraege.length + 1) / 2);
  }

  function linkeHTML(index) {
    if (index === 0) {
      return null;
    }

    const eintragIndex = index * 2 - 1;
    return eintragHTML(
      eintraege[eintragIndex],
      eintragIndex + 2
    );
  }

  function rechteHTML(index) {
    const eintragIndex = index * 2;

    return eintragHTML(
      eintraege[eintragIndex],
      eintragIndex + 2
    );
  }

  function seitenAnzeigen() {
    if (aktuelleDoppelseite === 0) {
      linkeSeite.className =
        "buchseite links steckbrief-seite";
      linkeSeite.innerHTML = "";
    } else {
      linkeSeite.className =
        "buchseite links papier";
      linkeSeite.innerHTML =
        linkeHTML(aktuelleDoppelseite);
    }

    rechteSeite.className =
      "buchseite rechts papier";

    rechteSeite.innerHTML =
      rechteHTML(aktuelleDoppelseite);

    zurueckButton.disabled =
      aktuelleDoppelseite === 0;
  }

  /* BUCH ÖFFNEN */

  function buchOeffnen() {
    buchbutton.style.display = "none";
    hinweis.style.display = "none";
    startbild.style.display = "none";

    video.style.display = "block";
    video.currentTime = 0;

    video.play().catch(() => {
      video.controls = true;
    });
  }

  video.addEventListener("ended", () => {
    video.style.display = "none";
    offenesbuch.style.display = "block";
    seitenklick.style.display = "block";
  });

  /* LESEMODUS */

  function lesemodusOeffnen() {
    aktuelleDoppelseite = 0;
    seitenAnzeigen();

    lesemodus.style.display = "flex";

    requestAnimationFrame(() => {
      lesemodus.classList.add("aktiv");
    });
  }

  function lesemodusSchliessen() {
    if (animationLaeuft) return;

    lesemodus.classList.remove("aktiv");

    setTimeout(() => {
      lesemodus.style.display = "none";
    }, 600);
  }

  /*
    VORWÄRTSBLÄTTERN

    Das rechte Blatt dreht sich nach links.
    Die Rückseite zeigt die nächste linke Seite.
  */

  function vorblattern() {
    if (animationLaeuft) return;

    if (
      aktuelleDoppelseite >=
      anzahlDoppelseiten() - 1
    ) {
      return;
    }

    animationLaeuft = true;

    const naechsteSeite =
      aktuelleDoppelseite + 1;

    blattVorne.innerHTML =
      rechteHTML(aktuelleDoppelseite);

    blattHinten.innerHTML =
      linkeHTML(naechsteSeite);

    /*
      Darunter bereits die neuen Seiten anzeigen.
      Das animierte Blatt verdeckt den Übergang.
    */

    aktuelleDoppelseite = naechsteSeite;
    seitenAnzeigen();

    blatt.style.display = "block";
    blatt.classList.remove("umgeblattert");
    blatt.style.transition = "none";

    void blatt.offsetWidth;

    blatt.style.transition =
      "transform 1.15s cubic-bezier(.45,.05,.3,1)";

    requestAnimationFrame(() => {
      blatt.classList.add("umgeblattert");
    });

    setTimeout(() => {
      blatt.style.display = "none";
      blatt.classList.remove("umgeblattert");
      animationLaeuft = false;
    }, 1200);
  }

  /*
    ZURÜCKBLÄTTERN

    Das Blatt dreht sich von links nach rechts.
  */

  function zurueckblattern() {
    if (animationLaeuft) return;
    if (aktuelleDoppelseite === 0) return;

    animationLaeuft = true;

    const vorherigeSeite =
      aktuelleDoppelseite - 1;

    blattVorne.innerHTML =
      rechteHTML(vorherigeSeite);

    blattHinten.innerHTML =
      linkeHTML(aktuelleDoppelseite);

    /*
      Erst das Blatt auf der linken Seite
      positionieren, dann zurückdrehen.
    */

    blatt.style.transition = "none";
    blatt.style.display = "block";
    blatt.classList.add("umgeblattert");

    aktuelleDoppelseite = vorherigeSeite;
    seitenAnzeigen();

    void blatt.offsetWidth;

    blatt.style.transition =
      "transform 1.15s cubic-bezier(.45,.05,.3,1)";

    requestAnimationFrame(() => {
      blatt.classList.remove("umgeblattert");
    });

    setTimeout(() => {
      blatt.style.display = "none";
      animationLaeuft = false;
    }, 1200);
  }

  /* ERSTE SEITEN ANZEIGEN */

  seitenAnzeigen();
</script>

</body>
</html>
